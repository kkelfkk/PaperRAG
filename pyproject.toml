[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperrag"
version = "0.1.0"
description = "Evaluation-driven RAG for academic papers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kkelfkk" }]
dependencies = [
  "fastembed>=0.8,<0.9",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "pdfplumber>=0.11,<0.12",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client[fastembed]>=1.17,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "reportlab>=4.0",
  "ruff>=0.9",
]
rerank = [
  "sentence-transformers>=5.1,<6",
]
ui = [
  "streamlit>=1.48,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
