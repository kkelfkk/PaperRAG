[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperrag"
version = "0.1.0"
description = "Evaluation-driven RAG for academic papers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kkelfkk" }]
dependencies = [
  "pdfplumber>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "reportlab>=4.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
